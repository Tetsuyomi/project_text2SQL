[tool.poetry]
name = "text2sql"
version = "0.1.0"
description = "A simple text-to-SQL generator using LLM7"
authors = ["Your Name <your.email@example.com>"]
package-mode= false

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.0"
uvicorn = "^0.30.6"
sqlalchemy = "^2.0.31"
asyncpg = "^0.29.0"
openai = "^1.40.0"
httpx = "^0.27.0"
tenacity = "^8.5.0"
jinja2 = "^3.1.4"
python-multipart = "^0.0.9"

[tool.poetry.scripts]
start = "app.main:app"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"